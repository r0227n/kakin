targets:
  $default:
    builders:
      drift_dev:
        options:
          store_date_time_values_as_text: true
      freezed:
        options:
          format: true
      slang_build_runner:
        options:
          base_locale: ja
          lazy: false
          input_directory: assets/i18n
          input_file_pattern: .i18n.json
          output_directory: lib/core/gen
          output_file_name: slang.g.dart
          format:
            enabled: true
          timestamp: false
